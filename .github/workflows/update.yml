name: Update routes

on:
  workflow_dispatch:
    inputs:
      disable_jr:
        description: JR東日本のデータを使用しない
        type: boolean
        default: false
      force_update:
        description: GTFSを強制的に再取得する
        type: boolean
        default: false
      force_stats_update:
        description: e-Stat家賃データを強制的に再取得する
        type: boolean
        default: false
      purge_challenge_data:
        description: JR由来の保存データを完全に削除する
        type: boolean
        default: false
  schedule:
    # 毎週月曜日03:00（日本時間）
    - cron: "0 18 * * 0"

permissions:
  contents: write

concurrency:
  group: update-routes
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Restore GTFS cache
        uses: actions/cache@v4
        with:
          path: |
            data/gtfs
            data/gtfs_basic_state.json
            data/gtfs_challenge_state.json
          key: gtfs-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            gtfs-${{ runner.os }}-

      - name: Install packages
        run: pip install -r requirements.txt

      - name: Resolve JR setting
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && \
             [ "${{ inputs.disable_jr }}" = "true" ]; then
            ENABLE_JR="false"
          else
            ENABLE_JR="true"
          fi
          if [ "${{ inputs.purge_challenge_data }}" = "true" ]; then
            ENABLE_JR="false"
          fi
          echo "ENABLE_JR=$ENABLE_JR" >> "$GITHUB_ENV"
          echo "JR東日本：$ENABLE_JR"

      - name: Update data
        env:
          ODPT_API_KEY: ${{ secrets.ODPT_API_KEY }}
          ODPT_CHALLENGE_API_KEY: ${{ secrets.ODPT_CHALLENGE_API_KEY }}
          ESTAT_APP_ID: ${{ secrets.ESTAT_APP_ID }}
          FORCE_UPDATE: ${{ inputs.force_update || 'false' }}
          FORCE_STATS_UPDATE: ${{ inputs.force_stats_update || 'false' }}
          PURGE_CHALLENGE_DATA: ${{ inputs.purge_challenge_data || 'false' }}
        run: python update_routes.py

      - name: Build access index
        run: python build_access_index.py

      - name: Verify generated data
        run: |
          python - <<'PY'
          import gzip, json, sqlite3
          from pathlib import Path

          config = json.loads(Path("build_config.json").read_text())
          challenge = Path("direct_timetable_challenge.json.gz")
          database = Path("direct_access.sqlite")
          print("build_config:", config)
          print("JRファイル存在:", challenge.exists())
          if challenge.exists():
              with gzip.open(challenge, "rt", encoding="utf-8") as f:
                  data = json.load(f)
              print("JR駅数:", len(data.get("stations", [])))
              print("JR平日列車数:", len(data.get("timetables", {}).get("weekday", [])))
          if not database.exists():
              raise SystemExit("direct_access.sqliteが生成されていません")
          if not Path("access_metadata.json.gz").exists():
              raise SystemExit("access_metadata.json.gzが生成されていません")
          with sqlite3.connect(database) as db:
              if db.execute("PRAGMA integrity_check").fetchone()[0] != "ok":
                  raise SystemExit("SQLite整合性エラー")
              meta = dict(db.execute("SELECT key,value FROM metadata"))
              print("索引情報:", meta)
              row = db.execute("SELECT MIN(minutes) FROM life_access WHERE origin='浜松町' AND destination='恵比寿'").fetchone()
              if row and row[0] is not None:
                  print("浜松町→恵比寿:", row[0], "分")
                  if row[0] > 25:
                      raise SystemExit("浜松町→恵比寿の索引時間が長すぎます")
          PY

      # GitHubの単一ファイル上限を避け、Streamlit起動時に一度だけ展開する。
      - name: Compress access index
        run: gzip -9 -f direct_access.sqlite

      - name: Remove old output
        run: rm -f direct_timetable.json

      - name: Commit updated files
        shell: bash
        run: |
          git config user.name github-actions
          git config user.email actions@github.com
          git add -A
          if git diff --cached --quiet; then
            echo "更新ファイルなし"
            exit 0
          fi
          git commit -m "Update timetable and access index"
          git pull --rebase origin main
          git push origin HEAD:main
