name: Update routes

on:
  workflow_dispatch:
    inputs:
      force_update:
        description: 全GTFSを強制的に再取得する
        type: boolean
        default: false
      force_stats_update:
        description: e-Stat家賃データを強制的に再取得する
        type: boolean
        default: false
  schedule:
    # 毎週月曜日03:00（日本時間）
    - cron: "0 18 * * 0"

permissions:
  contents: write

concurrency:
  group: update-routes
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Restore GTFS cache
        uses: actions/cache@v4
        with:
          path: |
            data/gtfs
            data/gtfs_sources_state.json
          key: gtfs-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            gtfs-${{ runner.os }}-

      - name: Install packages
        run: pip install -r requirements.txt

      - name: Update data
        env:
          ODPT_API_KEY: ${{ secrets.ODPT_API_KEY }}
          ESTAT_APP_ID: ${{ secrets.ESTAT_APP_ID }}
          FORCE_UPDATE: ${{ inputs.force_update || false }}
          FORCE_STATS_UPDATE: ${{ inputs.force_stats_update || false }}
        run: python update_routes.py

      - name: Commit updated files
        run: |
          git config user.name github-actions
          git config user.email actions@github.com
          git add \
            direct_timetable.json \
            station_locations.json \
            unresolved_stations.json \
            municipality_stats.json \
            data/municipality_stats_state.json
          git diff --cached --quiet || {
            git commit -m "Update multi-operator timetable data"
            git push
          }
