name: Update routes

on:
  workflow_dispatch:
    inputs:
      disable_jr:
        description: JR東日本のデータを使用しない
        type: boolean
        default: false

      force_update:
        description: GTFSを強制的に再取得する
        type: boolean
        default: false

      force_stats_update:
        description: e-Stat家賃データを強制的に再取得する
        type: boolean
        default: false

      purge_challenge_data:
        description: JR由来の保存データを完全に削除する
        type: boolean
        default: false

  schedule:
    # 毎週月曜日03:00（日本時間）
    - cron: "0 18 * * 0"

permissions:
  contents: write

concurrency:
  group: update-routes
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Restore GTFS cache
        uses: actions/cache@v4
        with:
          path: |
            data/gtfs
            data/gtfs_basic_state.json
            data/gtfs_challenge_state.json
          key: gtfs-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            gtfs-${{ runner.os }}-

      - name: Install packages
        run: pip install -r requirements.txt

      - name: Resolve JR setting
        shell: bash
        run: |
          # 原則JRを使用し、チェックした場合だけOFF
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && \
             [ "${{ inputs.disable_jr }}" = "true" ]; then
            ENABLE_JR="false"
          else
            ENABLE_JR="true"
          fi

          # 完全削除を選んだ場合もJRをOFF
          if [ "${{ inputs.purge_challenge_data }}" = "true" ]; then
            ENABLE_JR="false"
          fi

          echo "ENABLE_JR=$ENABLE_JR" >> "$GITHUB_ENV"
          echo "JR東日本：$ENABLE_JR"

      - name: Update data
        env:
          ODPT_API_KEY: ${{ secrets.ODPT_API_KEY }}
          ODPT_CHALLENGE_API_KEY: ${{ secrets.ODPT_CHALLENGE_API_KEY }}
          ESTAT_APP_ID: ${{ secrets.ESTAT_APP_ID }}
          FORCE_UPDATE: ${{ inputs.force_update || 'false' }}
          FORCE_STATS_UPDATE: ${{ inputs.force_stats_update || 'false' }}
          PURGE_CHALLENGE_DATA: ${{ inputs.purge_challenge_data || 'false' }}
        run: python update_routes.py

      - name: Verify JR data
        run: |
          python - <<'PY'
          import gzip, json
          from pathlib import Path

          config = json.loads(Path("build_config.json").read_text())
          path = Path("direct_timetable_challenge.json.gz")

          print("build_config:", config)
          print("JRファイル存在:", path.exists())

          if path.exists():
              with gzip.open(path, "rt", encoding="utf-8") as f:
                  data = json.load(f)
              print("JR駅数:", len(data.get("stations", [])))
              print("JR平日列車数:", len(data.get("timetables", {}).get("weekday", [])))
              print("JR駅の例:", [x["name"] for x in data.get("stations", [])[:20]])
          PY

      - name: Remove old output
        run: rm -f direct_timetable.json

      - name: Commit updated files
        shell: bash
        run: |
          git config user.name github-actions
          git config user.email actions@github.com
          git add -A

          if git diff --cached --quiet; then
            echo "更新ファイルなし"
            exit 0
          fi

          git commit -m "Update timetable data"
          git pull --rebase origin main
          git push origin HEAD:main
